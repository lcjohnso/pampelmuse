[build-system]
requires = [
    "setuptools>=61",
    "setuptools-scm>=8.0"  # automatically include files tracked by git
]
build-backend = "setuptools.build_meta"

[project]
name = "pampelmuse"
description = "A code to extract stellar spectra from integral field spectroscopic data"
authors = [{name = "Sebastian Kamann", email = "S.Kamann@ljmu.ac.uk"}]
readme = "README.txt"
license = {file = "LICENSE"}
dynamic = ["version"]
requires-python = ">= 3.7"
dependencies = [
    "numpy",
    "scipy",
    "astropy",
    "matplotlib>=3.5",
    "pandas>1.3",
    "tqdm"
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python"
]

[project.scripts]
PampelMuse = "pampelmuse.routines:main"

[project.optional-dependencies]
gui = ["PyQt5"]
nfm = ["maoppy>=1.5.0"]
pixtable = ["mpdaf"]

[project.urls]
Documentation = "https://pampelmuse.readthedocs.io/en/latest/"
Repository = "https://gitlab.gwdg.de/skamann/pampelmuse.git"

[tool.setuptools.dynamic]
version = {attr = "pampelmuse.__version__"}